services:
  postgres:
    image: postgres:16-alpine
    container_name: oly-portfolio-ts-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oly_portfolio_test
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - oly-network-test

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oly-studio-portfolio:test-local
    container_name: oly-portfolio-app-test
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oly_portfolio_test?schema=public
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads_data_test:/app/public/uploads
    networks:
      - oly-network-test
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  oly-network-test:
    driver: bridge

volumes:
  postgres_data_test:
    driver: local
  uploads_data_test:
    driver: local

