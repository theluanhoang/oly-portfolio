name: CI Pipeline

on:
  pull_request:
    branches:
      - prod
  push:
    branches-ignore:
      - prod

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
        run: |
          npm ci

      - name: Run linter
        run: |
          npm run lint || true

      - name: Check TypeScript
        run: |
          npx tsc --noEmit || true

      - name: Build application
        run: |
          npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy?schema=public"
          NEXTAUTH_SECRET: "dummy-secret-for-ci"
          ADMIN_USERNAME: "dummy"
          ADMIN_PASSWORD: "dummy"

