name: Deploy to Production (EC2)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  DOCKER_COMPOSE_VERSION: v2.24.0
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/oly-studio-portfolio

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      # =====================
      # Checkout source code
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Build & push image to Docker Hub
      # =====================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =====================
      # Create .env file from secrets
      # =====================
      - name: Create .env file from secrets
        run: |
          cat > .env << 'ENVEOF'
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'oly_portfolio' }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT || '5432' }}

          PGADMIN_DEFAULT_EMAIL=${{ secrets.PGADMIN_DEFAULT_EMAIL || '' }}
          PGADMIN_DEFAULT_PASSWORD=${{ secrets.PGADMIN_DEFAULT_PASSWORD || '' }}
          PGADMIN_PORT=${{ secrets.PGADMIN_PORT || '8080' }}

          NODE_ENV=production
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}

          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}

          NGINX_PORT=${{ secrets.NGINX_PORT || '80' }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL || '' }}
          ENVEOF

      # =====================
      # Copy minimal deploy files to EC2
      # =====================
      - name: Copy docker files to EC2
        env:
          RSYNC_RSH: ssh -i /tmp/rsync_key -o StrictHostKeyChecking=no -p ${{ secrets.EC2_SSH_PORT || 22 }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/rsync_key
          chmod 600 /tmp/rsync_key
          rsync -az --info=progress2 \
            docker-compose.prod.yml \
            docker \
            deploy \
            .env \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/
          rm -f /tmp/rsync_key


      # =====================
      # Deploy on EC2
      # =====================
      - name: Validate deploy image tag
        run: |
          set -e
          if [ -z "${{ env.DOCKER_IMAGE_NAME }}" ]; then
            echo "DOCKER_IMAGE_NAME is missing. Check secrets.DOCKERHUB_USERNAME or set DOCKER_IMAGE_NAME explicitly."
            exit 1
          fi
          echo "Using image: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 45m
          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            APP_IMAGE="${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}"
            export APP_IMAGE

            cd "$APP_DIR"

            echo "Checking Docker..."
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Please install Docker before deploying."
              exit 1
            fi

            echo "Checking Docker Compose..."
            if ! docker compose version &> /dev/null; then
              echo "Docker Compose (v2) not found. Please install it before deploying."
              exit 1
            fi
            sudo systemctl start docker || true

            echo "Loading environment variables..."
            if [ ! -f .env ]; then
              echo "Missing .env file"
              exit 1
            fi

            echo "Setting up uploads directory..."
            if [ ! -d "public/uploads" ]; then
              mkdir -p public/uploads
            fi
            if [ -d "public/uploads" ]; then
              chmod 777 public/uploads 2>/dev/null || sudo chmod 777 public/uploads 2>/dev/null || true
              echo "Uploads directory ready"
            fi

            echo "Starting services (pull always, no build)..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            docker compose -f docker-compose.prod.yml ps
            echo "Deployment completed!"

      # =====================
      # Health Check
      # =====================
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            max_attempts=20
            attempt=0

            until curl -fs http://localhost/api/health; do
              attempt=$((attempt + 1))
              echo "Health check attempt $attempt/$max_attempts"
              [ "$attempt" -ge "$max_attempts" ] && exit 1
              sleep 3
            done

            echo "Health check passed!"

      # =====================
      # Cleanup old Docker images (keep only recent ones)
      # =====================
      - name: Cleanup old Docker images
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            cd "$APP_DIR"
            
            # Make cleanup script executable
            if [ -f "deploy/cleanup-images.sh" ]; then
              chmod +x deploy/cleanup-images.sh
              
              # Cleanup: keep only 3 most recent images (configurable via KEEP_IMAGES secret)
              KEEP_COUNT="${{ secrets.KEEP_IMAGES || '3' }}"
              REPO_NAME="${{ env.DOCKER_IMAGE_NAME }}"
              
              echo "Cleaning up old Docker images..."
              echo "Repository: $REPO_NAME"
              echo "Keeping $KEEP_COUNT most recent images"
              
              # Run cleanup script
              REPO_NAME="$REPO_NAME" KEEP_COUNT="$KEEP_COUNT" USE_SUDO=0 bash deploy/cleanup-images.sh keep-recent "$KEEP_COUNT" || {
                echo "⚠️ Cleanup had some issues, but deployment succeeded"
              }
              
              echo "✅ Image cleanup completed"
            else
              echo "⚠️ Cleanup script not found, skipping cleanup"
              # Fallback to basic prune
              docker image prune -f --filter "until=24h" || true
            fi
            
            # Also cleanup unused/dangling images
            docker image prune -f || true

      # =====================
      # Summary
      # =====================
      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
