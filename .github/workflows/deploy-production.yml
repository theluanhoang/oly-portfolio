name: Deploy to Production (EC2)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  DOCKER_COMPOSE_VERSION: v2.24.0

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          # Create tar archive BEFORE creating .env to avoid conflicts
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='.env*' \
              --exclude='*.log' \
              --exclude='.DS_Store' \
              --exclude='coverage' \
              --exclude='tests' \
              --exclude='.vscode' \
              --exclude='.idea' \
              --exclude='public/uploads' \
              --exclude='deploy-package' \
              --exclude='deploy.tar.gz' \
              -czf deploy.tar.gz .
          ls -lh deploy.tar.gz

      - name: Create .env file from secrets
        run: |
          cat > .env << 'ENVEOF'
          POSTGRES_USER=${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB || 'oly_portfolio' }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT || '5432' }}
          NODE_ENV=production
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          NGINX_PORT=${{ secrets.NGINX_PORT || '80' }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL || '' }}
          ENVEOF
          echo ".env file created"

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          source: "deploy.tar.gz,.env"
          target: "/home/${{ secrets.EC2_USER }}/app"
          strip_components: 0
          timeout: 300s

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            
            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            cd $APP_DIR
            
            echo "Creating backup..."
            if [ -f docker-compose.prod.yml ]; then
              mkdir -p backup
              # Create compressed backup (faster and smaller)
              tar -czf backup/backup-$(date +%Y%m%d-%H%M%S).tar.gz \
                --exclude='backup' \
                --exclude='node_modules' \
                --exclude='.next' \
                --exclude='public/uploads' \
                . 2>/dev/null || true
              # Keep only last 3 backups to save disk space
              ls -t backup/backup-*.tar.gz 2>/dev/null | tail -n +4 | xargs rm -f 2>/dev/null || true
            fi
            
            echo "Extracting deployment package..."
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            
            echo "Setting up Docker Compose..."
            if ! command -v docker-compose &> /dev/null; then
              echo "Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            
            echo "Ensuring Docker is running..."
            sudo systemctl start docker || true
            sudo systemctl enable docker || true
            
            echo "Loading environment variables..."
            if [ -f .env ]; then
              echo "Using .env file from deployment"
              # Backup existing .env if it exists and is different
              if [ -f .env.backup ]; then
                mv .env.backup .env.backup.old
              fi
              cp .env .env.backup 2>/dev/null || true
            else
              echo "WARNING: No .env file found! Please configure GitHub Secrets."
              exit 1
            fi
            
            echo "Stopping old containers gracefully..."
            sudo docker compose -f docker-compose.prod.yml stop app nginx 2>/dev/null || true
            
            echo "Building with cache and parallel build..."
            sudo docker compose -f docker-compose.prod.yml build --parallel
            
            echo "Starting services..."
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "Waiting for services to be ready..."
            sleep 5
            
            echo "Checking service status..."
            sudo docker compose -f docker-compose.prod.yml ps
            
            echo "Deployment completed successfully!"

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            
            echo "Performing health check..."
            max_attempts=20
            attempt=0
            
            while [ $attempt -lt $max_attempts ]; do
              if curl -f -s http://localhost/api/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              
              attempt=$((attempt + 1))
              echo "Health check attempt $attempt/$max_attempts..."
              sleep 3
            done
            
            echo "❌ Health check failed after $max_attempts attempts"
            echo "Checking container logs..."
            sudo docker compose -f docker-compose.prod.yml logs --tail=50 app || true
            exit 1

      - name: Cleanup old Docker resources
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            echo "Cleaning up old Docker resources..."
            sudo docker image prune -f --filter "until=24h" || true

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "📊 Summary:"
            echo "  - Code deployed to EC2"
            echo "  - Containers started"
            echo "  - Health check passed"
          else
            echo "❌ Deployment failed!"
            echo "Check logs above for details"
          fi

