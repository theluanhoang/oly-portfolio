name: Deploy to Production (EC2)

on:
  push:
    branches:
      - prod
  workflow_dispatch:

env:
  DOCKER_COMPOSE_VERSION: v2.24.0
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/oly-studio-portfolio

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      # =====================
      # Checkout source code
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Build & push image to Docker Hub
      # =====================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
          platforms: linux/amd64


      # =====================
      # Deploy on EC2
      # =====================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 45m
          envs: DOCKER_IMAGE_NAME,GITHUB_SHA
          envs_format: export
          script: |
            set -e

            APP_DIR="/home/${{ secrets.EC2_USER }}/app"
            REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
            BRANCH="prod"

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            APP_IMAGE="${DOCKER_IMAGE_NAME}:${GITHUB_SHA}"
            export APP_IMAGE

            echo "Updating source from $BRANCH..."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "Ensuring Docker is installed..."
            if ! command -v docker &> /dev/null; then
              if command -v apt-get &> /dev/null; then
                sudo apt-get update -y
                sudo apt-get install -y docker.io
              elif command -v yum &> /dev/null; then
                sudo yum update -y
                sudo yum install -y docker
              else
                echo "No package manager found"
                exit 1
              fi
              sudo systemctl enable --now docker || true
            fi

            echo "Setting up Docker Compose..."
            DC_CMD="docker compose"
            : "${DOCKER_COMPOSE_VERSION:=v2.24.0}"
            OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')
            ARCH=$(uname -m)
            COMPOSE_URL="https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-${OS_NAME}-${ARCH}"
            echo "Downloading Docker Compose ${DOCKER_COMPOSE_VERSION} for ${OS_NAME}/${ARCH}"
            PLUGIN_DIR="/usr/libexec/docker/cli-plugins"

            if ! docker compose version &> /dev/null; then
              sudo mkdir -p "$PLUGIN_DIR"
              sudo curl -fL "$COMPOSE_URL" -o "$PLUGIN_DIR/docker-compose"
              sudo chmod +x "$PLUGIN_DIR/docker-compose"
            fi

            sudo systemctl start docker || true

            echo "Loading environment variables..."
            if [ ! -f .env ]; then
              echo "Missing .env file"
              exit 1
            fi

            echo "Stopping old containers..."
            sudo $DC_CMD -f docker-compose.prod.yml stop app nginx || true

            echo "Pulling app image..."
            sudo $DC_CMD -f docker-compose.prod.yml pull app

            echo "Starting services..."
            sudo $DC_CMD -f docker-compose.prod.yml up -d --remove-orphans

            sudo $DC_CMD -f docker-compose.prod.yml ps
            echo "Deployment completed!"

      # =====================
      # Health Check
      # =====================
      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            max_attempts=20
            attempt=0

            until curl -fs http://localhost/api/health; do
              attempt=$((attempt + 1))
              echo "Health check attempt $attempt/$max_attempts"
              [ "$attempt" -ge "$max_attempts" ] && exit 1
              sleep 3
            done

            echo "Health check passed!"

      # =====================
      # Cleanup
      # =====================
      - name: Cleanup old Docker resources
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            sudo docker image prune -f --filter "until=24h"

      # =====================
      # Summary
      # =====================
      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
