# SSL configuration for nginx with olystudio.vn

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
    application/json application/javascript application/xml+rss 
    application/rss+xml font/truetype font/opentype 
    application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    upstream nextjs {
        server app:3000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name olystudio.vn www.olystudio.vn;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = / {
            return 301 https://$host/vi;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name olystudio.vn www.olystudio.vn;

        ssl_certificate /etc/letsencrypt/live/olystudio.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/olystudio.vn/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, immutable, max-age=3600";
        }

        location /assets/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache_valid 200 30m;
            add_header Cache-Control "public, max-age=1800";
        }

        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            
            add_header X-Content-Type-Options "nosniff" always;
            
            try_files $uri =404;
        }

        location /api/uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            
            add_header X-Content-Type-Options "nosniff" always;
            
            try_files $uri =404;
        }

        location = / {
            return 301 /vi;
        }

        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        error_page 404 = @fallback_404;
        location @fallback_404 {
            if ($request_uri !~ ^/(en|vi)) {
                return 301 /vi$request_uri;
            }
            return 301 /vi;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}

